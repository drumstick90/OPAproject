<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="opa">
<title>opa · workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   OPA · faithful cobalt
   First principles: cleanliness, accuracy, efficiency, modularity
   Visual: lowercase chrome, soft greys, plump radii, cobalt accent
   ───────────────────────────────────────────────────────────── */

:root {
    --bg:           #f4f4f4;
    --surf:         #fafafa;
    --inset:        #ffffff;
    --border:       #e6e6e8;
    --border-2:    #efefef;
    --ink:          #19191c;
    --ink-2:        #5a5a60;
    --ink-3:        #9b9ba1;
    --ink-4:        #c8c8cc;
    --accent:       #1d4ed8;
    --accent-2:     #2563eb;
    --accent-soft:  rgba(29, 78, 216, 0.08);
    --accent-glow:  rgba(29, 78, 216, 0.16);
    --warn:         #b25c00;
    --warn-soft:    rgba(178, 92, 0, 0.08);
    --ok:           #1d7a3a;
    --err:          #b8243d;

    --shadow:    0 1px 2px rgba(15, 18, 30, 0.04);
    --shadow-md: 0 4px 14px rgba(15, 18, 30, 0.05), 0 1px 3px rgba(15, 18, 30, 0.04);
    --shadow-lg: -8px 0 32px rgba(15, 18, 30, 0.08);

    --r-card:    18px;
    --r-input:   14px;
    --r-pill:    999px;
    --r-mini:    10px;

    --mono:  'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    --sans:  'IBM Plex Sans', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

body { min-height: 100vh; min-height: 100dvh; }

/* ─── lowercase chrome (data stays canonical for markdown export) ─── */
.lc { text-transform: lowercase; }

/* ───── HEAD ───── */
.head {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 40;
}

.head-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 14px 28px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
}

.brand {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    text-transform: lowercase;
    letter-spacing: 0.02em;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
}
.brand .mark { display: inline-flex; align-items: center; }
.brand .dot { color: var(--accent); margin: 0 2px; }
.brand .sub {
    color: var(--ink-3);
    font-weight: 400;
    font-size: 11px;
}

.head-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

.icon-btn {
    appearance: none;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-2);
    font-family: var(--mono);
    font-size: 11.5px;
    text-transform: lowercase;
    padding: 7px 12px;
    cursor: pointer;
    border-radius: var(--r-pill);
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
}
.icon-btn:hover { background: var(--surf); color: var(--ink); border-color: var(--border); }

/* ───── GPT LAUNCHER ───── */
.gpt-launch,
.drug-launch {
    background: linear-gradient(180deg, var(--surf), var(--inset));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 20px 22px 22px;
    margin-bottom: 22px;
    box-shadow: var(--shadow-md);
}
.gpt-launch-head,
.drug-launch-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.gpt-launch-title,
.drug-launch-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    color: var(--ink);
}
.gpt-launch-title .dot,
.drug-launch-title .dot { color: var(--accent); margin: 0 1px; }
.gpt-launch-sub,
.drug-launch-sub {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    color: var(--ink-3);
}
.gpt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
}
.gpt-tile {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 13px;
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
}
.gpt-tile:hover {
    transform: translateY(-3px);
    border-color: var(--accent-glow);
    box-shadow: 0 8px 22px rgba(29, 78, 216, 0.12), 0 2px 6px rgba(15, 18, 30, 0.05);
}
.gpt-tile:active { transform: translateY(-1px); }
.gpt-badge {
    width: 54px;
    height: 54px;
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 600;
    text-transform: lowercase;
    letter-spacing: -0.02em;
    color: var(--accent);
    background: linear-gradient(150deg, var(--accent-soft), var(--accent-glow));
    border: 1px solid var(--accent-glow);
    transition: background 140ms ease, color 140ms ease, transform 140ms ease;
}
.gpt-tile:hover .gpt-badge {
    background: linear-gradient(150deg, var(--accent), var(--accent-2));
    color: #fff;
    transform: scale(1.05);
}
.gpt-tile-meta { display: flex; flex-direction: column; gap: 3px; }
.gpt-tile-name {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    text-transform: lowercase;
    color: var(--ink);
    line-height: 1.3;
}
.drug-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}
.drug-row input {
    flex: 1 1 240px;
    min-width: 180px;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--inset);
    color: var(--ink);
    border-radius: var(--r-input);
    padding: 11px 14px;
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
}
.drug-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
}
.drug-row .mini-btn {
    border-color: var(--border);
    background: var(--surf);
    color: var(--ink-2);
    padding: 9px 12px;
}
.drug-row .mini-btn:hover {
    color: var(--accent);
    border-color: var(--accent-glow);
    background: var(--inset);
}
@media (max-width: 640px) {
    .gpt-launch,
    .drug-launch { border-radius: 18px; padding: 16px; margin-bottom: 18px; }
    .gpt-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .gpt-badge { width: 48px; height: 48px; font-size: 17px; border-radius: 14px; }
    .gpt-tile { padding: 14px; gap: 11px; }
}

/* ───── TOOLBAR ───── */
.toolbar {
    max-width: 920px;
    margin: 0 auto;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: var(--bg);
    position: sticky;
    top: 41px;
    z-index: 30;
}

.tb-btn {
    appearance: none;
    background: var(--surf);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    text-transform: lowercase;
    padding: 9px 16px;
    cursor: pointer;
    border-radius: var(--r-pill);
    transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
}
.tb-btn:hover {
    border-color: var(--ink-3);
    background: var(--inset);
}
.tb-btn:active { transform: translateY(1px); }
.tb-btn.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}
.tb-btn.primary:hover {
    background: var(--accent-2);
    border-color: var(--accent-2);
    box-shadow: 0 0 0 4px var(--accent-soft);
}
.tb-btn .glyph { color: var(--accent); }
.tb-btn.primary .glyph { color: white; }

.tb-status {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 7px 12px;
    border-radius: var(--r-pill);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 160ms ease, color 160ms ease;
}
.tb-status .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}
.tb-status.warn {
    color: var(--warn);
    background: var(--warn-soft);
}
.tb-status.warn .pulse {
    background: var(--warn);
    box-shadow: 0 0 0 3px rgba(178, 92, 0, 0.16);
}
.tb-status.err {
    color: var(--err);
    background: rgba(184, 36, 61, 0.08);
}
.tb-status.err .pulse {
    background: var(--err);
    box-shadow: 0 0 0 3px rgba(184, 36, 61, 0.16);
}

/* ───── AI OUTPUT PANEL ───── */
.ai-panel {
    max-width: 920px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border);
    background: var(--inset);
    overflow: hidden;
    max-height: 0;
    transition: max-height 220ms ease;
}
.ai-panel.open {
    max-height: 80vh;
    overflow-y: auto;
}
.ai-panel-inner {
    padding: 18px 28px 22px;
    border-left: 3px solid var(--accent);
}
.ai-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    gap: 12px;
}
.ai-panel-title {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    color: var(--ink-2);
    letter-spacing: 0.04em;
}
.ai-panel-title b { color: var(--accent); font-weight: 600; }
.ai-panel-meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    text-transform: lowercase;
}
.ai-panel-body {
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-wrap;
}
.ai-panel-body strong { color: var(--accent); font-weight: 600; }

/* ───── MAIN ───── */
main {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 28px 80px;
}

.intro {
    margin-bottom: 28px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
}
.intro h1 {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.015em;
    line-height: 1.15;
    text-transform: lowercase;
}
.intro h1 em {
    color: var(--accent);
    font-style: normal;
    font-weight: 500;
}
.intro p {
    color: var(--ink-2);
    font-size: 12.5px;
    margin-top: 8px;
    font-family: var(--mono);
    text-transform: lowercase;
}

/* ───── SECTION ───── */
.section {
    margin-bottom: 18px;
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    gap: 8px;
    min-height: 24px;
}
.section-label {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-2);
    letter-spacing: 0.06em;
    text-transform: lowercase;
}
.section-label .num {
    color: var(--ink-4);
    margin-right: 8px;
}
.section-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 120ms ease;
}
.section:hover .section-actions,
.section:focus-within .section-actions { opacity: 1; }
.section[data-id="plan"] .section-actions { opacity: 1; }

.mini-btn {
    appearance: none;
    background: transparent;
    border: 1px solid transparent;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    padding: 4px 9px;
    cursor: pointer;
    border-radius: var(--r-pill);
    transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
}
.mini-btn:hover {
    color: var(--accent);
    border-color: var(--border);
    background: var(--surf);
}

textarea.field {
    width: 100%;
    background: var(--inset);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    padding: 14px 16px;
    border-radius: var(--r-input);
    resize: none;
    outline: none;
    overflow: hidden;
    min-height: 1.55em;
    transition: border-color 120ms ease;
}
textarea.field::placeholder {
    color: var(--ink-3);
    font-style: italic;
}
textarea.field:hover { border-color: var(--ink-3); }
textarea.field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

/* MSE group — single elevated card with rows inside */
.group {
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 18px 22px;
    margin: 22px 0;
    box-shadow: var(--shadow);
}
.group-head {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: lowercase;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-2);
    display: flex;
    align-items: baseline;
    gap: 10px;
}
.group-head .num { color: var(--ink-4); }

.subsection {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 16px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--border-2);
    align-items: start;
}
.subsection:last-child { border-bottom: none; }
.sub-label {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    color: var(--ink-2);
    padding-top: 12px;
    line-height: 1.3;
    letter-spacing: 0.04em;
}

/* Inside groups, fields shed their card — they're rows in a single card */
.group textarea.field {
    background: transparent;
    border: none;
    box-shadow: none;
    border-radius: 0;
    padding: 8px 0;
}
.group textarea.field:hover { border: none; background: var(--bg); }
.group textarea.field:focus {
    border: none;
    box-shadow: none;
    background: var(--accent-soft);
    padding: 8px 0;
}

@media (max-width: 720px) {
    .subsection { grid-template-columns: 1fr; gap: 4px; }
    .sub-label { padding-top: 0; }
}

/* ───── DRAWER ───── */
.scrim {
    position: fixed;
    inset: 0;
    background: rgba(15, 18, 30, 0.32);
    backdrop-filter: blur(2px);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    height: 100dvh;
    width: min(540px, 92vw);
    background: var(--bg);
    border-left: 1px solid var(--border);
    z-index: 90;
    transform: translateX(100%);
    transition: transform 240ms cubic-bezier(.2,.6,.2,1);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
}
.drawer.open { transform: translateX(0); }

.drawer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
}
.drawer-title {
    font-family: var(--mono);
    font-size: 11.5px;
    text-transform: lowercase;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.06em;
}
.drawer-title .accent { color: var(--accent); }

.drawer-body {
    padding: 20px 22px 40px;
    overflow-y: auto;
    flex: 1;
}

.drawer-section {
    margin-bottom: 24px;
    padding-bottom: 22px;
    border-bottom: 1px dashed var(--border);
}
.drawer-section:last-child { border: none; }

.drawer-section h3 {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    color: var(--ink-2);
    margin-bottom: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
}

.field-row { margin-bottom: 12px; }
.field-row label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: lowercase;
    color: var(--ink-2);
    margin-bottom: 6px;
}
.field-row input[type=text],
.field-row input[type=password],
.field-row select,
.field-row textarea {
    width: 100%;
    background: var(--inset);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 12px;
    border-radius: var(--r-input);
    outline: none;
    transition: border-color 120ms ease, box-shadow 120ms ease;
    box-shadow: var(--shadow);
}
.field-row textarea {
    font-size: 12px;
    min-height: 100px;
    resize: vertical;
}
.field-row input:focus,
.field-row select:focus,
.field-row textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
.field-row .help {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    margin-top: 5px;
    line-height: 1.45;
}

/* Frasario list */
.frasario-cat { margin-bottom: 18px; }
.frasario-cat-head {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    color: var(--ink-2);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.06em;
}
.frasario-phrase {
    padding: 10px 12px;
    margin-bottom: 5px;
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: var(--r-input);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 120ms ease, box-shadow 120ms ease;
    box-shadow: var(--shadow);
}
.frasario-phrase:hover {
    border-color: var(--accent);
    background: var(--inset);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
.frasario-empty {
    font-style: italic;
    color: var(--ink-3);
    font-family: var(--sans);
    font-size: 13.5px;
}

/* Redact preview split */
.redact-preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
}
.redact-col h4 {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    margin-bottom: 6px;
    letter-spacing: 0.06em;
}
.redact-col h4.original { color: var(--ink-2); }
.redact-col h4.redacted { color: var(--accent); }
.redact-col pre {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    background: var(--inset);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: var(--r-input);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 50vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
}
.redact-col mark {
    background: var(--accent);
    color: white;
    padding: 1px 4px;
    border-radius: 4px;
    font-weight: 500;
}
@media (max-width: 720px) {
    .redact-preview { grid-template-columns: 1fr; }
    .redact-col pre { max-height: 38vh; }
}

.redact-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
}

/* Questionnaire iframe */
.q-iframe-wrap {
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    overflow: hidden;
    background: var(--inset);
    height: 70vh;
    box-shadow: var(--shadow);
}
.q-iframe-wrap iframe { width: 100%; height: 100%; border: none; }

.q-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--r-input);
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 120ms ease, box-shadow 120ms ease;
    background: var(--inset);
    box-shadow: var(--shadow);
}
.q-list-item:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
.q-list-item .q-name {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
}
.q-list-item .q-meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    text-transform: lowercase;
}

/* Markdown output modal */
.modal-md {
    background: var(--inset);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 18px 20px;
    white-space: pre-wrap;
    max-height: 60vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
}

/* Section picker */
.section-pick {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 60vh;
    overflow-y: auto;
}
.section-pick button {
    text-align: left;
    appearance: none;
    background: var(--inset);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: lowercase;
    cursor: pointer;
    border-radius: var(--r-input);
    transition: border-color 120ms ease, box-shadow 120ms ease;
    box-shadow: var(--shadow);
}
.section-pick button:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.plan-monitoring {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 0;
}
.plan-action {
    position: relative;
}
.plan-drug-btn,
.plan-bubble button {
    appearance: none;
    border: 1px solid currentColor;
    background: transparent;
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: lowercase;
    padding: 4px 9px;
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: background 120ms ease, box-shadow 120ms ease;
}
.plan-drug-btn[data-kind="antipsychotics"] {
    color: var(--accent);
}
.plan-drug-btn[data-kind="valproate"] {
    color: var(--warn);
}
.plan-drug-btn[data-kind="lithium"] {
    color: var(--ok);
}
.plan-drug-btn:hover,
.plan-bubble button:hover {
    background: var(--inset);
    box-shadow: 0 0 0 3px var(--accent-soft);
}
.plan-bubble {
    position: absolute;
    top: calc(100% + 7px);
    right: 0;
    z-index: 60;
    display: none;
    gap: 5px;
    padding: 6px;
    background: var(--inset);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    box-shadow: var(--shadow-md);
}
.plan-action.open .plan-bubble { display: flex; }
.plan-bubble button {
    color: var(--ink-2);
    white-space: nowrap;
}

/* Spinner */
.spin {
    display: inline-block;
    width: 11px; height: 11px;
    border: 1.5px solid var(--ink-3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 11.5px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    padding: 10px 16px;
    border-radius: var(--r-pill);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    box-shadow: var(--shadow-md);
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* Util */
.hidden { display: none !important; }
::selection { background: var(--accent); color: white; }

/* ─────────────────────────────────────────────────────────────

const Store = {
    get(key, fallback) {
        try {
            const v = localStorage.getItem(key);
            return v == null ? fallback : JSON.parse(v);
        } catch { return fallback; }
    },
    set(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); }
        catch (e) { console.warn('storage set failed', e); }
    }
};

/* ─── UTIL ─── */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

function el(tag, props, ...children) {
    const e = document.createElement(tag);
    if (props) {
        for (const k in props) {
            if (k === 'class') e.className = props[k];
            else if (k === 'style') e.setAttribute('style', props[k]);
            else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
            else if (k in e) e[k] = props[k];
            else e.setAttribute(k, props[k]);
        }
    }
    children.flat().forEach(c => {
        if (c == null || c === false) return;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
}

function flattenSections() {
    const out = [DIAGNOSIS_SECTION];
    for (const s of TEMPLATE.sections) {
        if (s.group) for (const c of s.children) out.push(c);
        else out.push(s);
    }
    return out;
}

function getSectionMeta(id) { return flattenSections().find(s => s.id === id); }

function autosize(t) {
    t.style.height = 'auto';
    t.style.height = (t.scrollHeight + 2) + 'px';
}

function toast(msg, ms = 1800) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), ms);
}

function setStatus(text, kind = 'ok') {
    $('#status-text').textContent = text;
    const s = $('#status');
    s.classList.remove('warn', 'err');
    if (kind === 'warn') s.classList.add('warn');
    if (kind === 'err')  s.classList.add('err');
}

/* ─── RENDER ─── */
function renderDiagnosisField() {
    const root = $('#diagnosis-form');
    if (!root) return;
    root.innerHTML = '';
    root.appendChild(renderSection(DIAGNOSIS_SECTION, 'dx'));
}

function renderForm() {
    const root = $('#form');
    root.innerHTML = '';
    let n = 0;
    for (const s of TEMPLATE.sections) {
        if (s.group) {
            const g = el('div', { class: 'group' });
            n++;
            const numStr = String(n).padStart(2, '0');
            g.appendChild(el('div', { class: 'group-head' },
                el('span', { class: 'num' }, numStr),
                s.label
            ));
            for (const c of s.children) g.appendChild(renderSubsection(c));
            root.appendChild(g);
        } else {
            n++;
            root.appendChild(renderSection(s, n));
        }
    }
    $$('textarea.field').forEach(t => {
        t.addEventListener('input', () => {
            State.draft[t.dataset.id] = t.value;
            saveDraft();
            autosize(t);
        });
        t.addEventListener('focus', () => { State.lastFocusedField = t.dataset.id; });
        autosize(t);
    });
}

function renderSection(s, n) {
    const numStr = typeof n === 'number' ? String(n).padStart(2, '0') : String(n);
    const value = State.draft[s.id] != null ? State.draft[s.id] : (s.default || '');
    State.draft[s.id] = value;

    const sec = el('div', { class: 'section', 'data-id': s.id });
    sec.appendChild(el('div', { class: 'section-head' },
        el('div', { class: 'section-label' },
            el('span', { class: 'num' }, numStr),
            s.label
        ),
        el('div', { class: 'section-actions' },
            s.id === 'plan' ? renderPlanMonitoringButtons() : null,
            el('button', { class: 'mini-btn', onclick: () => openFrasario(s.id) }, '✦ phrases'),
            el('button', { class: 'mini-btn', onclick: () => resetField(s.id) }, '↺ default'),
            cacheHas(s.id) ? el('button', { class: 'mini-btn', style: 'color:var(--accent)', onclick: () => revertField(s.id) }, '⟲ revert') : null
        )
    ));
    sec.appendChild(el('textarea', {
        class: 'field',
        'data-id': s.id,
        rows: 1,
        placeholder: s.placeholder || s.default || '',
        value: value
    }));
    return sec;
}

function renderSubsection(c) {
    const value = State.draft[c.id] != null ? State.draft[c.id] : (c.default || '');
    State.draft[c.id] = value;
    return el('div', { class: 'subsection', 'data-id': c.id },
        el('div', { class: 'sub-label' }, c.label),
        el('div', null,
            el('textarea', {
                class: 'field',
                'data-id': c.id,
                rows: 1,
                placeholder: c.placeholder || c.default || '',
                value: value
            })
        )
    );
}

function renderPlanMonitoringButtons() {
    return el('div', { class: 'plan-monitoring', 'aria-label': 'GP monitoring instructions' },
        renderPlanDrugAction('antipsychotics'),
        renderPlanDrugAction('valproate'),
        renderPlanDrugAction('lithium')

}

    return el('div', { class: 'plan-action' },

        }, kind),
        el('div', { class: 'plan-bubble' },
            el('button', { type: 'button', onclick: (e) => setPlanInstruction(e, kind, 'initiation') }, 'initiation'),
            el('button', { type: 'button', onclick: (e) => setPlanInstruction(e, kind, 'monitoring') }, 'monitoring')
        )

}

/* ─── FIELD OPS ─── */
function resetField(id) {
    const meta = getSectionMeta(id);
    if (!meta) return;
    State.draft[id] = meta.default || '';
    saveDraft();
    const t = $(`textarea[data-id="${id}"]`);
    if (t) { t.value = State.draft[id]; autosize(t); }
}

function closePlanActionBubbles() {
    $$('.plan-action.open').forEach(a => a.classList.remove('open'));
}

function togglePlanActionBubble(event) {
    event.stopPropagation();
    const action = event.currentTarget.closest('.plan-action');
    const wasOpen = action.classList.contains('open');
    closePlanActionBubbles();
    if (!wasOpen) action.classList.add('open');
}

function setPlanInstruction(event, kind, mode) {
    event.stopPropagation();
    const instructions = mode === 'initiation' ? GP_INITIATION_INSTRUCTIONS : GP_MONITORING_INSTRUCTIONS;
    const instruction = instructions[kind];
    if (!instruction) return;

    const current = State.draft.plan || getSectionMeta('plan').default || '';
    const parts = current.split(/\n\s*\n/);
    const tail = parts.length > 1 ? parts.slice(1).join('\n\n') : DEFAULT_PLAN_TAIL;
    const next = `${instruction}\n\n${tail}`.trim();

    State.draft.plan = next;
    saveDraft();

    const t = $('textarea[data-id="plan"]');
    if (t) {
        t.value = next;
        autosize(t);
        t.focus();
    }
    closePlanActionBubbles();
    toast(`${kind} ${mode} inserted`);
}

function cacheHas(id) { return State.cache && State.cache[id] != null; }
function cacheSet(id, prev) { State.cache[id] = prev; saveCache(); }
function cacheClear(id) { delete State.cache[id]; saveCache(); }
function revertField(id) {
    if (!cacheHas(id)) return;
    State.draft[id] = State.cache[id];
    saveDraft();
    cacheClear(id);
    renderForm();
    toast('reverted');
}

/* ─── REDACT ─── */
const REDACT = {
    patterns: [
        { name: 'NHS',      re: /\b\d{3}[ \-]?\d{3}[ \-]?\d{4}\b/g,                                        rep: '[NHS]' },
        { name: 'POSTCODE', re: /\b[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}\b/gi,                                 rep: '[POSTCODE]' },
        { name: 'EMAIL',    re: /\b[\w.+\-]+@[\w\-]+\.[\w.\-]+\b/g,                                        rep: '[EMAIL]' },
        { name: 'PHONE',    re: /(?:\+44\s?|\b0)(?:\d\s?){9,10}/g,                                         rep: '[PHONE]' },
        { name: 'DOB',      re: /\bDOB[:\s]+[^\n,;]+/gi,                                                   rep: 'DOB: [DOB]' },
        { name: 'DATE',     re: /\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/g,                                rep: '[DATE]' },
        { name: 'DATE',     re: /\b\d{1,2}(?:st|nd|rd|th)?\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{2,4}\b/gi, rep: '[DATE]' },
        { name: 'NAME',     re: /\b(?:Mr|Mrs|Ms|Miss|Dr|Prof)\.?\s+[A-Z][a-z]+(?:[\-\s][A-Z][a-z]+)?/g,    rep: '[NAME]' },
        { name: 'NAME',     re: /\b(?:[Pp]atient)\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)?/g,                      rep: 'patient [NAME]' },
        { name: 'ADDR',     re: /\b\d{1,4}\s+[A-Z][A-Za-z'\-]*(?:\s+[A-Z][A-Za-z'\-]*)*\s+(?:Street|St|Road|Rd|Avenue|Ave|Lane|Ln|Close|Cl|Drive|Dr|Way|Court|Ct|Place|Pl|Crescent|Cres|Terrace|Ter|Square|Sq|Gardens|Gdns)\b/g, rep: '[ADDRESS]' }
    ],
    apply(text) {
        let out = text;
        const log = [];
        for (const p of this.patterns) {
            out = out.replace(p.re, m => { log.push({ name: p.name, original: m }); return p.rep; });
        }
        return { redacted: out, log };
    },
    highlightOriginal(text) {
        const merged = new RegExp(
            this.patterns.map(p => p.re.source).join('|'),
            'g' + (this.patterns.some(p => p.re.flags.includes('i')) ? 'i' : '')
        );
        return escapeHtml(text).replace(new RegExp(merged.source, merged.flags), m => `<mark>${escapeHtml(m)}</mark>`);
    },
    highlightRedacted(text) {
        return escapeHtml(text).replace(/\[(NHS|POSTCODE|EMAIL|PHONE|DOB|DATE|NAME|ADDRESS)\]/g, m => `<mark>${m}</mark>`);
    }
};

function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ─── ASSEMBLE NOTE (markdown — uses canonical proper-case labels) ─── */
function assembleMarkdown() {
    const lines = [];
    const diagnosis = (State.draft[DIAGNOSIS_SECTION.id] || '').trim();
    for (const s of TEMPLATE.sections) {
        if (s.id === 'medications' && diagnosis) {
            lines.push('');
            lines.push(DIAGNOSIS_SECTION.label);
            lines.push(diagnosis);
        }
        if (s.group) {
            lines.push('');
            for (const c of s.children) {
                const v = (State.draft[c.id] || '').trim();
                if (!v) continue;
                if (s.id === 'mse' && lines[lines.length - 1] !== '') lines.push('');
                lines.push(v);
            }
        } else {
            const v = (State.draft[s.id] || '').trim();
            if (!v) continue;
            lines.push('');
            lines.push(s.label);
            lines.push(v);
        }
    }
    return lines.join('\n').trim() + '\n';
}

function buildField(label, type, value, onChange, help) {
    const row = el('div', { class: 'field-row' });
    row.appendChild(el('label', null, label));
    const inp = el('input', { type: type, value: value || '' });
    inp.addEventListener('input', () => onChange(inp.value));
    row.appendChild(inp);
    if (help) row.appendChild(el('div', { class: 'help' }, help));
    return row;
}

function openDrugSearch(kind) {
    const input = $('#drug-query');
    const raw = input ? input.value.trim() : '';
    if (!raw) {
        toast('enter a drug name');
        if (input) input.focus();
        return;
    }
    const q = encodeURIComponent(raw);

        bnf: `https://bnf.nice.org.uk/search/?q=${q}`,
        fda: `https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=${q}`,
        drugs: `https://www.drugs.com/search.php?searchterm=${q}`

/* ─── FRASARIO ─── */
function openFrasario(targetSectionId) {
    const wrap = el('div');
    if (!State.frasario.categories || !State.frasario.categories.length) {
        wrap.appendChild(el('div', { class: 'frasario-empty' },
            'no phrases yet. add them in settings → phrases.'));
    } else {
        for (const cat of State.frasario.categories) {
            const isMatch = !targetSectionId || cat.target === targetSectionId;
            const cWrap = el('div', { class: 'frasario-cat' });
            cWrap.appendChild(el('div', { class: 'frasario-cat-head' },
                cat.name + (cat.target ? ` · ${cat.target}` : '')));
            for (const phrase of (cat.phrases || [])) {
                cWrap.appendChild(el('div', {
                    class: 'frasario-phrase',
                    onclick: () => insertPhrase(phrase, targetSectionId || cat.target)
                }, phrase));
            }
            if (!isMatch) cWrap.style.opacity = '0.55';
            wrap.appendChild(cWrap);
        }
    }
    openDrawer('<span class="accent">·</span> phrases' +
        (targetSectionId ? ` <span style="color:var(--ink-3); font-weight:400">→ ${targetSectionId}</span>` : ''),
        wrap);
}

function insertPhrase(phrase, targetSectionId) {
    let id = targetSectionId || State.lastFocusedField;
    if (!id) {
        return openSectionPicker((picked) => {
            doInsert(picked, phrase);
            closeDrawer();
        });
    }
    doInsert(id, phrase);
    closeDrawer();
}

function doInsert(id, phrase) {
    const t = $(`textarea[data-id="${id}"]`);
    if (!t) { toast('field not found'); return; }
    const start = t.selectionStart, end = t.selectionEnd;
    const before = t.value.slice(0, start);
    const after = t.value.slice(end);
    const sep = before && !before.endsWith('\n') && !before.endsWith(' ') ? ' ' : '';
    const newVal = before + sep + phrase + after;
    t.value = newVal;
    t.focus();
    const pos = start + sep.length + phrase.length;
    t.setSelectionRange(pos, pos);
    State.draft[id] = newVal;
    saveDraft();
    autosize(t);
    toast(`inserted into ${id}`);
}

function openSectionPicker(onPick) {
    const wrap = el('div', { class: 'section-pick' });
    for (const s of flattenSections()) {
        wrap.appendChild(el('button', { onclick: () => onPick(s.id) }, s.label));
    }
    openDrawer('<span class="accent">·</span> pick section', wrap);
}

$('#btn-frasario').addEventListener('click', () => openFrasario(null));

/* ─── QUESTIONNAIRES ─── */
function openQuestionnaires() {
    const wrap = el('div');
    if (!State.qreg.length) {
        wrap.appendChild(el('div', { class: 'frasario-empty' },
            'no questionnaires registered. add them in settings → questionnaire registry.'));
    } else {
        for (const q of State.qreg) {
            wrap.appendChild(el('div', {
                class: 'q-list-item',
                onclick: () => launchQuestionnaire(q)
            },
                el('div', { class: 'q-name' }, q.label),
                el('div', { class: 'q-meta' }, q.id)
            ));
        }
    }
    openDrawer('<span class="accent">·</span> questionnaires', wrap);
}

function launchQuestionnaire(q) {
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'field-row help', style: 'margin-bottom:10px' },
        `loading ${q.label}. complete the questionnaire — the result will return automatically. press esc to cancel.`));
    const ifWrap = el('div', { class: 'q-iframe-wrap' });
    const iframe = el('iframe', { src: q.url });
    ifWrap.appendChild(iframe);
    wrap.appendChild(ifWrap);
    openDrawer(`<span class="accent">·</span> ${q.label.toLowerCase()}`, wrap);
}

window.addEventListener('message', (ev) => {
    const data = ev.data;
    if (!data || data.type !== 'opa-result' || typeof data.prose !== 'string') return;
    closeDrawer();
    setTimeout(() => {
        openSectionPicker((id) => {
            doInsert(id, data.prose);
            closeDrawer();
            toast('questionnaire result inserted');
        });
    }, 250);
});

function sListJoin(arr, sep) {
    if (arr.length === 0) return '';
    if (arr.length === 1) return arr[0];
    const list = [...arr];
    const last = list.pop();
    return `${list.join(sep)}${sep === ', ' ? ', and ' : '; and '}${last}`;
}

function closeScreeningPanel() {
    document.body.classList.remove('screening-open');
    const panel = $('#screening-panel');
    if (panel) panel.innerHTML = '';
    sActiveTool = null;
    sState = null;
}

function sPanelWrap(titleHtml, content) {
    const panel = $('#screening-panel');
    panel.innerHTML = '';
    document.body.classList.add('screening-open');
    const headH = ($('.head') || {offsetHeight: 44}).offsetHeight;
    const toolbarH = ($('.toolbar') || {offsetHeight: 52}).offsetHeight;
    const top = headH + toolbarH;
    panel.style.top = top + 'px';
    panel.style.maxHeight = `calc(100vh - ${top}px)`;
    const hdr = el('div', { class: 'sp-head' });
    const titleEl = el('div', { class: 'sp-title' });
    titleEl.innerHTML = titleHtml;
    hdr.appendChild(titleEl);
    hdr.appendChild(el('button', { class: 'icon-btn', onclick: closeScreeningPanel }, 'close ✕'));
    panel.appendChild(hdr);
    panel.appendChild(content);
}

        storageKey: 'opa.screening.asex.v1',
        title: { plain: 'ASE', em: 'X' },
        subtitle: 'Arizona Sexual Experience Scale — sexual function screening',
        instructions: `<strong>Instructions.</strong> Select one response for each of the five items. For item 3, choose the applicable erection or vaginal lubrication question, then answer it once. Each response scores 1–6; the total ranges from <strong>5–30</strong>, with higher scores indicating greater sexual dysfunction. Complete all five items before interpreting or inserting the result.`,
        format: 'choices',
        scoreDenominator: 30,
        questions: [
            {
                id: 1, text: 'How strong is your sex drive?', short: 'Sex drive',
                options: [
                    { value: '1', label: 'Extremely strong', score: 1 },
                    { value: '2', label: 'Very strong', score: 2 },
                    { value: '3', label: 'Somewhat strong', score: 3 },
                    { value: '4', label: 'Somewhat weak', score: 4 },
                    { value: '5', label: 'Very weak', score: 5 },
                    { value: '6', label: 'Absent', score: 6 }
                ]
            },
            { id: 2, text: 'How easily are you sexually aroused?', short: 'Arousal', options: ASEX_EASE_OPTIONS },
            {
                id: 3, text: 'Choose the applicable item 3 question.', short: 'Erection / vaginal lubrication',
                variants: [
                    { value: 'erection', label: '3a · Erection', text: 'Can you easily get and keep an erection?', short: 'Erection' },
                    { value: 'lubrication', label: '3b · Vaginal lubrication', text: 'How easily does your vagina become moist?', short: 'Vaginal lubrication' }
                ],
                options: ASEX_EASE_OPTIONS
            },
            { id: 4, text: 'How easily can you reach orgasm?', short: 'Ability to reach orgasm', options: ASEX_EASE_OPTIONS },
            {
                id: 5, text: 'Are your orgasms satisfying?', short: 'Orgasm satisfaction',
                options: [
                    { value: '1', label: 'Extremely satisfying', score: 1 },
                    { value: '2', label: 'Very satisfying', score: 2 },
                    { value: '3', label: 'Somewhat satisfying', score: 3 },
                    { value: '4', label: 'Somewhat unsatisfying', score: 4 },
                    { value: '5', label: 'Extremely unsatisfying', score: 5 },
                    { value: '6', label: 'Never achieve orgasm', score: 6 }
                ]
            }
        ],
        computeResult: function(state) {
            const items = this.questions.flatMap(q => {
                const option = q.options.find(o => o.value === (state.answers || {})[q.id]);
                const variant = q.variants && q.variants.find(v => v.value === (state.variants || {})[q.id]);
                if (!option || (q.variants && !variant)) return [];
                return [{ id: q.id, short: variant ? variant.short : q.short, score: option.score, response: option.label }];
            });
            const complete = items.length === this.questions.length;
            const total = items.reduce((sum, item) => sum + item.score, 0);
            // McGahuey et al. (2000): any one of these three criteria is sufficient.
            const criteria = [];
            if (complete) {
                if (total >= 19) criteria.push('total score ≥19');
                if (items.some(item => item.score >= 5)) criteria.push('at least one item ≥5');
                if (items.filter(item => item.score >= 4).length >= 3) criteria.push('at least three items ≥4');
            }
            return {
                score: complete ? total : null,
                answered: items.length,
                complete,
                band: complete ? (criteria.length ? 'elevated' : 'below') : null,
                endorsed: items.filter(item => item.score >= 4),
                items,
                criteria
            };
        },
        bandHeadline: (score, band) => `Score ${score}/30 · ASEX screening criteria ${band === 'elevated' ? 'met' : 'not met'}`,
        bandBody: (score, band, endorsed, result) => {
            const interpretation = band === 'elevated'
                ? `ASEX screening criteria for sexual dysfunction are met: ${result.criteria.join('; ')}.`
                : 'ASEX screening criteria for sexual dysfunction are not met. A below-threshold result does not exclude a clinically significant difficulty.';
            const items = result.items.map(item => `${item.short} ${item.score}/6 (${item.response.toLowerCase()})`).join('; ');
            return `<p>${interpretation}</p><p>Item scores: ${items}.</p><p>Interpret alongside clinical assessment. This scale does not establish the cause of sexual difficulties.</p>`;
        },
        opaProse: (score, band, endorsed, result) => {
            if (!result.complete) return '';
            const interpretation = band === 'elevated'
                ? `ASEX screening criteria for sexual dysfunction were met (${result.criteria.join('; ')}).`
                : 'ASEX screening criteria for sexual dysfunction were not met.';
            const items = result.items.map(item => `${item.short.toLowerCase()} ${item.score}/6`).join('; ');
            return `The patient completed the Arizona Sexual Experience Scale (ASEX), scoring ${score}/30 (range 5–30; higher scores indicate greater sexual dysfunction). ${interpretation} Item scores: ${items}. This is a screening result and does not establish aetiology.`;
        },
        footer: `<p><strong>Reference:</strong> McGahuey CA et al. (2000). <em>Journal of Sex &amp; Marital Therapy</em>, 26(1), 25–38. <a href="https://doi.org/10.1080/009262300278623" target="_blank" rel="noopener noreferrer">Original study</a> · <a href="https://depts.washington.edu/psychres/wordpress/wp-content/uploads/2017/09/asex_scale.pdf" target="_blank" rel="noopener noreferrer">Questionnaire</a>.</p><p>Criteria: total ≥19, OR any one item ≥5, OR at least three items ≥4. Count only one version of item 3. Screening supports clinical assessment; it does not establish a diagnosis or cause.</p>`
    },
    cyclothymia: {
        slug: 'cyclothymia',
        scoreLabel: 'present',
        scoreDenominator: 15,
        title: { plain: 'cyclo', em: 'thymia' },
        subtitle: 'Historical clinical criteria checklist for cyclothymic temperament',
        instructions: `<strong>Instructions.</strong> For each criterion, select <em>Present</em>, <em>Absent</em>, or <em>Unclear / not assessed</em>. This historical checklist has no validated score or diagnostic cut-off; use it to structure longitudinal assessment and interpret it against current diagnostic criteria.`,
        format: 'checklist3',
        options: [
            { value: 'present', label: 'Present', short: 'Present' },
            { value: 'absent', label: 'Absent', short: 'Absent' },
            { value: 'unclear', label: 'Unclear / not assessed', short: 'Unclear' }
        ],
        columnLabels: ['Present', 'Absent', 'Unclear<br>or not assessed'],
        questions: [
            { id: 1, category: 'General', text: "Onset in teens or early adulthood" },
            { id: 2, category: 'General', text: "Clinical presentation as a personality disorder; the patient may be unaware of distinct “moods”" },
            { id: 3, category: 'General', text: "Short cycles—usually days—which recur irregularly, with infrequent euthymic periods" },
            { id: 4, category: 'General', text: "May not reach a full depressive or hypomanic syndrome during any one cycle, but the full range of affective manifestations occurs at different times" },
            { id: 5, category: 'General', text: "“Endogenous” mood changes, often waking with the mood already present" },
            { id: 6, category: 'Biphasic course', text: "Hypersomnia alternating with decreased need for sleep (intermittent insomnia may also occur)" },
            { id: 7, category: 'Biphasic course', text: "Shaky self-esteem alternating between lack of self-confidence and naïve or grandiose overconfidence" },
            { id: 8, category: 'Biphasic course', text: "Periods of mental confusion and apathy alternating with sharpened and creative thinking" },
            { id: 9, category: 'Biphasic course', text: "Marked unevenness in the quantity and quality of productivity, often associated with unusual working hours" },
            { id: 10, category: 'Biphasic course', text: "Uninhibited people-seeking (potentially including hypersexuality) alternating with introverted self-absorption" },
            { id: 11, category: 'Behavioural manifestations', text: "Irritable, angry or explosive outbursts that alienate loved ones" },
            { id: 12, category: 'Behavioural manifestations', text: "Episodic promiscuity; repeated conjugal or romantic failure" },
            { id: 13, category: 'Behavioural manifestations', text: "Frequent shifts in line of work, study, interest or future plans" },
            { id: 14, category: 'Behavioural manifestations', text: "Resort to alcohol and drug abuse as a means for self-treatment or augmenting excitement" },
            { id: 15, category: 'Behavioural manifestations', text: "Occasional financial extravagance" }
        ],
        computeResult: function(state) {
            const answers = state.answers || {};
            const present = this.questions.filter(q => answers[q.id] === 'present');
            const absent = this.questions.filter(q => answers[q.id] === 'absent');
            const unclear = this.questions.filter(q => answers[q.id] === 'unclear');
            const answered = present.length + absent.length + unclear.length;
            return {
                score: present.length,
                band: 'indeterminate',
                complete: answered === this.questions.length,
                answered,
                endorsed: present,
                presentCount: present.length,
                absentCount: absent.length,
                unclearCount: unclear.length
            };
        },
        bandHeadline: (score, band, result) => `${score}/15 criteria marked present · no diagnostic cut-off`,
        bandBody: (score, band, endorsed, result) => {
            const present = result.presentCount;
            const absent = result.absentCount;
            const unclear = result.unclearCount;
            const presentText = present === 1 ? 'criterion is' : 'criteria are';
            return `<p>${present}/15 ${presentText} marked present; ${absent} marked absent; ${unclear} unclear or not assessed.</p><p>These are historical descriptive criteria attributed to Akiskal et al. (1979). They do not establish cyclothymia and should be interpreted using current diagnostic criteria, longitudinal history, collateral information, and exclusion of substance or medical causes.</p>`;
        },
        endorsedRender: (endorsed) => endorsed.map(e => `${e.category} — ${e.text}`),
        opaProse: (score, band, endorsed, result) => {
            const presentText = endorsed.length ? ` Criteria marked present: ${sListJoin(endorsed.map(e => `${e.category}: ${e.text}`), '; ')}.` : '';
            return `The patient completed the cyclothymia clinical criteria checklist today: ${score}/15 criteria marked present, ${result.absentCount} marked absent, and ${result.unclearCount} unclear or not assessed. This historical checklist has no validated diagnostic cut-off and does not establish a diagnosis; interpret it against current diagnostic criteria and the longitudinal clinical picture.${presentText}`;
        },
        footer: `<p><strong>Source:</strong> Akiskal HS, Khani MK, Scott-Strauss A. <em>Cyclothymic temperamental disorders.</em> <em>Psychiatric Clinics of North America</em>. 1979;2:527–554. Criteria reproduced/adapted from the supplied reference.</p><p>This is a clinical checklist, not a validated diagnostic instrument or a substitute for current diagnostic assessment.</p>`
    }
};

let sActiveTool = null;
let sState = null;

function openScreeningLauncher() {
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'field-row help', style: 'margin-bottom:14px' },
        'Validated brief screens. Complete the instrument — the scored paragraph inserts directly into the note.'));
    for (const toolId in SCREENING_TOOLS) {
        const tool = SCREENING_TOOLS[toolId];
        wrap.appendChild(el('div', {
            class: 'q-list-item',
            onclick: () => openScreeningTool(tool)
        },
            el('div', { class: 'q-name' }, `${tool.title.plain}${tool.title.em}`),
            el('div', { class: 'q-meta' }, `${tool.questions.length} items · ${tool.subtitle.split('—')[0].trim()}`)
        ));
    }
    sPanelWrap('<span class="accent">·</span> screening', wrap);
}

function openScreeningTool(tool) {
    sActiveTool = tool;
    sState = { toolSlug: tool.slug, answers: {}, initials: '', date: new Date().toISOString().split('T')[0], clinician: '' };

    const wrap = el('div');

    wrap.appendChild(el('button', { class: 'mini-btn s-back', onclick: openScreeningLauncher }, '← all instruments'));

    const hdr = el('div', { class: 's-header' });
    hdr.appendChild(el('div', { class: 's-title' }, `${tool.title.plain}${tool.title.em}`));
    const badge = el('div', { class: 's-score-badge', id: 's-score-badge' });
    badge.appendChild(el('div', { class: 's-score-label' }, tool.scoreLabel || 'score'));
    badge.appendChild(el('div', { class: 's-score-value' },
        el('span', { id: 's-score-num' }, '0'),
        el('span', { class: 's-score-denom' }, `/${tool.scoreDenominator || tool.questions.length}`)
    ));
    badge.appendChild(el('div', { class: 's-score-progress', id: 's-score-progress' }, `0 of ${tool.questions.length} answered`));
    hdr.appendChild(badge);
    hdr.appendChild(el('div', { class: 's-subtitle' }, tool.subtitle));
    wrap.appendChild(hdr);

    const meta = el('div', { class: 's-meta' });
    [
        { id: 's-initials', label: 'patient initials', type: 'text', key: 'initials'  },
        { id: 's-date',     label: 'date',             type: 'date', key: 'date'      },
        { id: 's-clinician',label: 'clinician',        type: 'text', key: 'clinician' }
    ].forEach(f => {
        const fld = el('div', { class: 's-meta-field' });
        fld.appendChild(el('label', { for: f.id }, f.label));
        const inp = el('input', { type: f.type, id: f.id, autocomplete: 'off' });
        if (f.key === 'date') inp.value = sState.date;
        inp.addEventListener('input', () => { if (sState) sState[f.key] = inp.value; sScreeningSave(); });
        fld.appendChild(inp);
        meta.appendChild(fld);
    });
    wrap.appendChild(meta);

    const instr = el('div', { class: 's-instructions' });
    instr.innerHTML = tool.instructions;
    wrap.appendChild(instr);

    const qTable = el('div', { class: 's-q-table', id: 's-q-table' });
    if (tool.columnLabels && tool.columnLabels.length) {
        const hRow = el('div', { class: `s-q-header s-${tool.format}` });
        hRow.innerHTML = `<div></div><div></div>${tool.columnLabels.map(l => `<div class="s-q-col-label">${l}</div>`).join('')}`;
        qTable.appendChild(hRow);
    }
    let currentCategory = null;
    tool.questions.forEach(q => {
        if (q.category && q.category !== currentCategory) {
            currentCategory = q.category;
            qTable.appendChild(el('div', { class: 's-category-head' }, q.category));
        }
        const qOptions = q.options || tool.options;
        const qFormat = q.format || tool.format;
        if (qFormat === 'choices') {
            const row = el('fieldset', { class: 's-q-row s-choices', 'data-sqid': String(q.id) });
            row.innerHTML = `
                <legend class="s-choice-question"><span class="s-q-num">${String(q.id).padStart(2, '0')}</span><span class="s-q-text">${q.text}</span></legend>
                ${q.variants ? `<div class="s-question-variant"><label for="sq${q.id}-variant">Item ${q.id} version</label><select id="sq${q.id}-variant" data-question-variant="${q.id}"><option value="">Choose the applicable question…</option>${q.variants.map(v => `<option value="${v.value}">${v.label}</option>`).join('')}</select></div>` : ''}
                <div class="s-choice-options">${qOptions.map(opt => `<label class="s-choice-option"><input type="radio" name="sq${q.id}" value="${opt.value}" id="sq${q.id}_${opt.value}"${q.variants ? ' disabled' : ''}><span>${opt.score}. ${opt.label}</span></label>`).join('')}</div>
            `;
            qTable.appendChild(row);
            return;
        }
        if (q.columnLabels && q.columnLabels.length) {
            const qHeader = el('div', { class: `s-q-header s-${qFormat}` });
            qHeader.innerHTML = `<div></div><div></div>${q.columnLabels.map(l => `<div class="s-q-col-label">${l}</div>`).join('')}`;
            qTable.appendChild(qHeader);
        }
        const row = el('div', { class: `s-q-row s-${qFormat}`, 'data-sqid': String(q.id) });
        row.innerHTML = `
            <div class="s-q-num">${String(q.id).padStart(2, '0')}</div>
            <div class="s-q-text">${q.text}${q.criterion ? `<span class="s-criterion">${q.criterion}</span>` : ''}</div>
            ${qOptions.map(opt => `<div class="s-q-cell"><input type="radio" name="sq${q.id}" value="${opt.value}" id="sq${q.id}_${opt.value}" aria-label="${opt.label}"></div>`).join('')}
            <div class="s-q-options-mobile">${qOptions.map(opt => `<label data-svalue="${opt.value}" data-sqid="${q.id}">${opt.short || opt.label}</label>`).join('')}</div>
        `;
        qTable.appendChild(row);
    });
    wrap.appendChild(qTable);

    wrap.appendChild(el('div', { class: 's-result', id: 's-result' }));
    wrap.appendChild(el('div', { class: 's-insert-area', id: 's-insert-area' }));
    wrap.appendChild(el('div', { class: 's-actions' },
        el('button', {
            class: 'tb-btn',
            onclick: () => { if (Object.keys(sState.answers).length === 0 || confirm('Reset all answers?')) sScreeningReset(); }
        }, '↺ reset')
    ));

    const footer = el('div', { class: 's-footer' });
    footer.innerHTML = tool.footer;
    wrap.appendChild(footer);

    sPanelWrap(`<span class="accent">·</span> ${tool.title.plain}<em style="font-style:normal;color:var(--accent)">${tool.title.em}</em>`, wrap);

    const qt = $('#s-q-table');
    qt.addEventListener('change', e => {
        if (e.target.matches('select[data-question-variant]')) {
            const qid = Number(e.target.dataset.questionVariant);
            if (!sState.variants) sState.variants = {};
            sState.variants[qid] = e.target.value;
            delete sState.answers[qid];
            const row = $(`.s-q-row[data-sqid="${qid}"]`);
            row.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            sUpdateMobileSelection(qid, '');
            sSyncQuestionVariants();
            sScreeningSave();
            sScreeningRecompute();
            return;
        }
        if (!e.target.matches('input[type="radio"]')) return;
        const qid = parseInt(e.target.name.replace('sq', ''));
        sState.answers[qid] = e.target.value;
        sUpdateMobileSelection(qid, e.target.value);
        sScreeningSave();
        sScreeningRecompute();
    });
    qt.addEventListener('click', e => {
        const lbl = e.target.closest('.s-q-options-mobile label');
        if (!lbl) return;
        const qid = parseInt(lbl.dataset.sqid);
        const val = lbl.dataset.svalue;
        sState.answers[qid] = val;
        const radio = document.getElementById(`sq${qid}_${val}`);
        if (radio) radio.checked = true;
        sUpdateMobileSelection(qid, val);
        sScreeningSave();
        sScreeningRecompute();
    });

    sScreeningLoadState();
    sSyncQuestionVariants();
    sScreeningRecompute();
}

function sSyncQuestionVariants() {
    for (const q of sActiveTool.questions) {
        if (!q.variants) continue;
        const row = $(`.s-q-row[data-sqid="${q.id}"]`);
        const variant = q.variants.find(v => v.value === (sState.variants || {})[q.id]);
        row.querySelector('select').value = variant ? variant.value : '';
        row.querySelector('.s-q-text').textContent = variant ? variant.text : q.text;
        row.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = !variant);
    }
}

function sUpdateMobileSelection(qid, val) {
    const row = $(`.s-q-row[data-sqid="${qid}"]`);
    if (!row) return;
    row.querySelectorAll('.s-q-options-mobile label').forEach(l =>
        l.classList.toggle('selected', l.dataset.svalue === val)
    );
}

function sScreeningCompute() {
    if (sActiveTool.computeResult) return sActiveTool.computeResult(sState);

    let score = 0;
    const endorsed = [];
    sActiveTool.questions.forEach(q => {
        const ans = sState.answers[q.id];
        if (!ans) return;
        const opt = (q.options || sActiveTool.options).find(o => o.value === ans);
        const itemScore = sActiveTool.scoreItem(q, opt);
        const points = typeof itemScore === 'number' ? itemScore : (itemScore ? 1 : 0);
        score += points;
        if (points > 0) endorsed.push(q);
    });
    return { score, band: sActiveTool.band(score), endorsed };
}

function sScreeningRecompute() {
    if (!sActiveTool) return;
    const result = sScreeningCompute();
    const { score, band, endorsed } = result;
    const answered = result.answered ?? Object.keys(sState.answers).length;
    const total = sActiveTool.questions.length;
    const complete = result.complete ?? (answered === total);

    const numEl = $('#s-score-num'), progEl = $('#s-score-progress'), badge = $('#s-score-badge');
    if (numEl) numEl.textContent = score == null ? '—' : score;
    if (progEl) progEl.textContent = `${answered} of ${total} answered`;
    if (badge) {
        badge.classList.remove('warn', 'err');
        if (complete) {
            if (band === 'elevated') badge.classList.add('err');
            else if (band === 'indeterminate') badge.classList.add('warn');
        }
    }

    sActiveTool.questions.forEach(q => {
        const row = $(`.s-q-row[data-sqid="${q.id}"]`);
        if (row) row.classList.toggle('s-answered', !!sState.answers[q.id]);
    });

    const panel = $('#s-result'), insertArea = $('#s-insert-area');
    if (complete) {
        if (panel) {
            panel.className = `s-result show s-${band}`;
            const eyebrow = band === 'elevated'
                ? (sActiveTool.slug === 'msi-bpd' ? 'above traditional cut-off' : 'above screening threshold')
                : band === 'indeterminate' ? 'indeterminate range' : 'below screening threshold';
            const endorsedHtml = sActiveTool.endorsedRender && endorsed.length > 0
                ? `<div class="s-endorsed"><div class="s-endorsed-label">items endorsed</div><ul>${sActiveTool.endorsedRender(endorsed).map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`
                : '';
            panel.innerHTML = `
                <div class="s-result-eyebrow">${eyebrow}</div>
                <div class="s-result-headline">${escapeHtml(sActiveTool.bandHeadline(score, band, result))}</div>
                <div class="s-result-body">${sActiveTool.bandBody(score, band, endorsed, result)}</div>
                ${endorsedHtml}
            `;
        }
        if (insertArea) {
            insertArea.style.display = 'block';
            insertArea.innerHTML = '';
            insertArea.appendChild(el('button', {
                class: 'tb-btn primary',
                onclick: () => sDoInsert('clinical_summary')
            }, el('span', { class: 'glyph' }, '↓'), ' insert into clinical summary'));
        }
    } else {
        if (panel) panel.className = 's-result';
        if (insertArea) insertArea.style.display = 'none';
    }
}

function sDoInsert(sectionId) {
    const result = sScreeningCompute();
    const complete = result.complete ?? (Object.keys(sState.answers).length === sActiveTool.questions.length);
    if (!complete) { toast('complete all items before inserting'); return; }
    const { score, band, endorsed } = result;
    doInsert(sectionId, sActiveTool.opaProse(score, band, endorsed, result));
    toast('inserted into clinical summary');
}

function sScreeningStorageKey() {
    return sActiveTool.storageKey || `screening-state-${sActiveTool.slug}-v1`;
}

function sScreeningSave() {
    if (!sActiveTool) return;
    try { localStorage.setItem(sScreeningStorageKey(), JSON.stringify(sState)); } catch(e) {}
}

function sScreeningLoadState() {
    if (!sActiveTool) return;
    try {
        const raw = localStorage.getItem(sScreeningStorageKey());
        if (!raw) return;
        const loaded = JSON.parse(raw);
        sState = { ...sState, ...loaded };
        Object.entries(sState.answers).forEach(([qid, val]) => {
            const radio = document.getElementById(`sq${qid}_${val}`);
            if (radio) radio.checked = true;
            sUpdateMobileSelection(parseInt(qid), val);
        });
        const iEl = $('#s-initials'), dEl = $('#s-date'), cEl = $('#s-clinician');
        if (iEl) iEl.value = sState.initials || '';
        if (dEl) dEl.value = sState.date || new Date().toISOString().split('T')[0];
        if (cEl) cEl.value = sState.clinician || '';
    } catch(e) {}
}

function sScreeningReset() {
    sState = { toolSlug: sActiveTool.slug, answers: {}, initials: '', date: new Date().toISOString().split('T')[0], clinician: '' };
    try { localStorage.removeItem(sScreeningStorageKey()); } catch(e) {}
    document.querySelectorAll('#s-q-table input[type="radio"]').forEach(r => r.checked = false);
    document.querySelectorAll('#s-q-table .s-q-options-mobile label').forEach(l => l.classList.remove('selected'));
    const iEl = $('#s-initials'), dEl = $('#s-date'), cEl = $('#s-clinician');
    if (iEl) iEl.value = '';
    if (dEl) dEl.value = sState.date;
    if (cEl) cEl.value = '';
    sSyncQuestionVariants();
    sScreeningRecompute();
}

$('#btn-screening').addEventListener('click', openScreeningLauncher);

async function runAIFunction(fnId) {
    const fn = State.settings.functions[fnId];
    if (!fn) { toast('function not configured'); return; }
    if (!State.settings.apiKey) {
        toast('set openai api key in settings');
        openSettings();
        return;
    }

    let payload, sourceLabel;
    if (fn.target === 'note') {
        payload = assembleMarkdown();
        sourceLabel = 'full note';
    } else {
        const id = State.lastFocusedField;
        if (!id) { toast('click into a section first'); return; }
        payload = State.draft[id] || '';
        sourceLabel = id;
    }

    const { redacted, log } = REDACT.apply(payload);
    const ok = await showRedactPreview(payload, redacted, log, sourceLabel, fn.label);
    if (!ok) return;

    setStatus('sending to openai…', 'warn');
    const resp = await callOpenAI(fn.systemPrompt, redacted);
    if (resp.error) {
        setStatus('error', 'err');
        showAIPanel(fn.label, sourceLabel, '', `**Error:** ${resp.error}`);
        return;
    }
    setStatus('redacted before send');
    showAIPanel(fn.label, sourceLabel, resp.usage, resp.text);
}

function showRedactPreview(original, redacted, log, sourceLabel, fnLabel) {
    return new Promise((resolve) => {
        const wrap = el('div');
        wrap.appendChild(el('div', { class: 'field-row help', style: 'margin-bottom:14px' },
            `function: ${fnLabel.toLowerCase()}. source: ${sourceLabel}. items redacted: ${log.length}.`));

        const grid = el('div', { class: 'redact-preview' });
        const colA = el('div', { class: 'redact-col' });
        colA.appendChild(el('h4', { class: 'original' }, 'original (not sent)'));
        const preA = el('pre');
        preA.innerHTML = REDACT.highlightOriginal(original);
        colA.appendChild(preA);

        const colB = el('div', { class: 'redact-col' });
        colB.appendChild(el('h4', { class: 'redacted' }, 'redacted (will be sent)'));
        const preB = el('pre');
        preB.innerHTML = REDACT.highlightRedacted(redacted);
        colB.appendChild(preB);

        grid.appendChild(colA);
        grid.appendChild(colB);
        wrap.appendChild(grid);

        const actions = el('div', { class: 'redact-actions' });
        actions.appendChild(el('button', {
            class: 'tb-btn',
            onclick: () => { closeDrawer(); resolve(false); }
        }, 'cancel'));
        actions.appendChild(el('button', {
            class: 'tb-btn primary',
            onclick: () => { closeDrawer(); resolve(true); }
        }, 'send to openai →'));
        wrap.appendChild(actions);

        openDrawer('<span class="accent">·</span> redact preview', wrap);
    });
}

async function callOpenAI(systemPrompt, userContent) {
    try {
        const r = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${State.settings.apiKey}`
            },
            body: JSON.stringify({
                model: State.settings.model,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user',   content: userContent }
                ],
                temperature: 0.2
            })
        });
        if (!r.ok) {
            const errBody = await r.text();
            return { error: `${r.status} ${r.statusText} — ${errBody.slice(0, 200)}` };
        }
        const data = await r.json();
        const text = data.choices?.[0]?.message?.content || '(empty response)';
        const usage = data.usage ? `${data.usage.total_tokens} tokens` : '';
        return { text, usage };
    } catch (e) {
        return { error: e.message };
    }
}

function showAIPanel(fnLabel, sourceLabel, usage, body) {
    $('#ai-fn-name').textContent = fnLabel.toLowerCase();
    $('#ai-meta').textContent = [sourceLabel, usage].filter(Boolean).join(' · ');
    const rendered = escapeHtml(body)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    $('#ai-body').innerHTML = rendered;
    $('#ai-panel').classList.add('open');
    $('#ai-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('#ai-panel-close').addEventListener('click', () => {
    $('#ai-panel').classList.remove('open');
});

$('#btn-check-validity').addEventListener('click', () => runAIFunction('check_validity'));

const drugInput = $('#drug-query');
if (drugInput) {
    drugInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            openDrugSearch('bnf');
        }
    });
}
$('#drug-bnf').addEventListener('click', () => openDrugSearch('bnf'));
$('#drug-fda').addEventListener('click', () => openDrugSearch('fda'));
$('#drug-drugs').addEventListener('click', () => openDrugSearch('drugs'));

/* ─── COPY MARKDOWN ─── */
$('#btn-copy-md').addEventListener('click', async () => {
    const md = assembleMarkdown();
    try {
        await navigator.clipboard.writeText(md);
        toast('markdown copied');
    } catch {
        const wrap = el('div');
        wrap.appendChild(el('div', { class: 'modal-md' }, md));
        openDrawer('<span class="accent">·</span> markdown', wrap);
    }
});

/* ─── RESET ─── */
$('#btn-clear').addEventListener('click', () => {
    if (!confirm('reset all sections to defaults? your draft will be cleared.')) return;
    State.draft = {};
    State.cache = {};
    saveDraft(); saveCache();
    renderDiagnosisField();
    renderForm();
    toast('reset to defaults');
});

/* ─── INIT ─── */
renderDiagnosisField();
renderForm();
if (State.settings.apiKey) setStatus('redacted before send');
else setStatus('no api key set', 'warn');

</script>
</body>
